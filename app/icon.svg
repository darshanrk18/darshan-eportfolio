<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Primary blue gradient matching portfolio theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient for DK letters -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter for depth -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background: Rounded square with gradient -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner shadow for depth -->
  <rect x="2" y="2" width="124" height="124" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- DK monogram - Bold, modern, elegant -->
  <text 
    x="64" 
    y="84" 
    font-family="system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif" 
    font-size="58" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#textGradient)" 
    filter="url(#textShadow)"
    style="letter-spacing: -4px;">
    DK
  </text>
</svg>

